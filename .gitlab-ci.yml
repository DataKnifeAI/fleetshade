# Mirror target: gitlab.com/dk-raas/dkai/tools/dioptra
# Builds images → Harbor, optional deploy → Rancher prd-apps
stages:
  - docker
  - deploy

variables:
  HARBOR_PROJECT: library
  IMAGE_NAME_WEB: dioptra
  IMAGE_NAME_API: dioptra-api
  # Bake site marker at image build (override in GitLab CI/CD variables)
  DIOPTRA_SITE_MARKER: ${DIOPTRA_SITE_MARKER}

.harbor-buildkit:
  stage: docker
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  tags:
    - kubernetes
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

publish-web:
  extends: .harbor-buildkit
  script:
    - |
      set -euo pipefail
      if [ -z "${HARBOR_REGISTRY:-}" ] || [ -z "${HARBOR_PROJECT:-}" ]; then
        echo "HARBOR_REGISTRY / HARBOR_PROJECT required"
        exit 1
      fi
      if [ -z "${DIOPTRA_SITE_MARKER:-}" ]; then
        echo "DIOPTRA_SITE_MARKER CI variable required for web image"
        exit 1
      fi
      IMAGE_TAG="${CI_COMMIT_SHORT_SHA:-$CI_PIPELINE_ID}"
      DEST="$HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME_WEB"
      OUTPUT_FLAGS="--output type=image,name=$DEST:latest,push=true"
      OUTPUT_FLAGS="$OUTPUT_FLAGS --output type=image,name=$DEST:$IMAGE_TAG,push=true"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        OUTPUT_FLAGS="$OUTPUT_FLAGS --output type=image,name=$DEST:$CI_COMMIT_TAG,push=true"
      fi
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile \
        --opt build-arg:VITE_SITE_MARKER="$DIOPTRA_SITE_MARKER" \
        --opt build-arg:VITE_STATUS_URL=/api/status \
        $OUTPUT_FLAGS

publish-api:
  extends: .harbor-buildkit
  script:
    - |
      set -euo pipefail
      if [ -z "${HARBOR_REGISTRY:-}" ] || [ -z "${HARBOR_PROJECT:-}" ]; then
        echo "HARBOR_REGISTRY / HARBOR_PROJECT required"
        exit 1
      fi
      IMAGE_TAG="${CI_COMMIT_SHORT_SHA:-$CI_PIPELINE_ID}"
      DEST="$HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME_API"
      OUTPUT_FLAGS="--output type=image,name=$DEST:latest,push=true"
      OUTPUT_FLAGS="$OUTPUT_FLAGS --output type=image,name=$DEST:$IMAGE_TAG,push=true"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        OUTPUT_FLAGS="$OUTPUT_FLAGS --output type=image,name=$DEST:$CI_COMMIT_TAG,push=true"
      fi
      # BuildKit expects Dockerfile by default; use Dockerfile.api via opt
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile.api \
        $OUTPUT_FLAGS

deploy-prd-apps:
  stage: deploy
  image: bitnami/kubectl:latest
  tags:
    - kubernetes
  needs: [publish-web, publish-api]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $PRD_APPS_KUBECONFIG'
  script:
    - |
      set -euo pipefail
      mkdir -p ~/.kube
      echo "$PRD_APPS_KUBECONFIG" | base64 -d > ~/.kube/config 2>/dev/null \
        || printf '%s\n' "$PRD_APPS_KUBECONFIG" > ~/.kube/config
      chmod 600 ~/.kube/config
      export KUBECONFIG=~/.kube/config
      IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
      WEB_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME_WEB:$IMAGE_TAG"
      API_IMAGE="$HARBOR_REGISTRY/$HARBOR_PROJECT/$IMAGE_NAME_API:$IMAGE_TAG"
      # Apply runtime manifests only (never secret.example.yaml)
      kubectl apply -f k8s/namespace.yaml
      kubectl apply -f k8s/api-deployment.yaml
      kubectl apply -f k8s/web-deployment.yaml
      kubectl -n dioptra set image deployment/dioptra-web web="$WEB_IMAGE"
      kubectl -n dioptra set image deployment/dioptra-api api="$API_IMAGE"
      kubectl -n dioptra rollout status deployment/dioptra-web --timeout=180s
      kubectl -n dioptra rollout status deployment/dioptra-api --timeout=180s
