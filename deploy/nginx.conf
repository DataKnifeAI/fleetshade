server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  # Live read-only API (upstream holds site-marker + origin checks)
  location /api/ {
    limit_except GET HEAD OPTIONS { deny all; }
    # Compose service / k8s Service name
    proxy_pass http://dioptra-api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
    proxy_set_header Referer $http_referer;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Prefer live API; keep static snapshot as offline fallback only
  location = /status.json {
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location / {
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ /index.html;
  }

  location ~* /(\.git|\.env|node_modules) {
    deny all;
    return 404;
  }
}
