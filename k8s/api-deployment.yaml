apiVersion: apps/v1
kind: Deployment
metadata:
  name: dioptra-api
  namespace: dioptra
  labels:
    app: dioptra-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dioptra-api
  template:
    metadata:
      labels:
        app: dioptra-api
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: api
          image: harbor.dataknife.net/library/dioptra-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - secretRef:
                name: dioptra-api
          env:
            - name: DIOPTRA_API_HOST
              value: "0.0.0.0"
            - name: DIOPTRA_API_PORT
              value: "8787"
            - name: DIOPTRA_REFRESH_SECONDS
              value: "30"
            - name: DIOPTRA_RATE_LIMIT_PER_MIN
              value: "60"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: dioptra-api
  namespace: dioptra
  labels:
    app: dioptra-api
spec:
  selector:
    app: dioptra-api
  ports:
    - name: http
      port: 8787
      targetPort: http
