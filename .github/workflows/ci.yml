name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci || npm install
      - run: npm test
      - name: build
        env:
          VITE_SITE_MARKER: ci-test-marker-not-for-prod
          VITE_STATUS_URL: /api/status
        run: npm run build
