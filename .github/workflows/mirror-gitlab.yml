name: mirror-gitlab

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

jobs:
  push-to-gitlab:
    name: Push to GitLab mirror
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "GITLAB_TOKEN secret is not set; skip mirror"
            exit 0
          fi
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote remove gitlab 2>/dev/null || true
          git remote add gitlab https://gitlab.com/dk-raas/dkai/tools/dioptra.git
          git config credential.helper '!f() { echo "username=oauth2"; echo "password=${GITLAB_TOKEN}"; }; f'
          git push gitlab HEAD:main --force
